<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Family Paws</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Family Paws</h1>
        <p>Questions? Send us a message.</p>
        <button id="menuButton">Menu</button>
        <nav id="mainNav">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>This form is for class project purposes and does not send real messages.</p>

            <form id="contactForm">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="service">Service Interest</label>
                <select id="service" name="service">
                    <option value="">Choose one</option>
                    <option value="daycare">Daycare</option>
                    <option value="boarding">Boarding</option>
                    <option value="grooming">Grooming</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">Submit</button>
            </form>

            <p id="formMessage"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Family Paws. Fictional website created for a class project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
